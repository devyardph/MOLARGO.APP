<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!--
    The browser tab icon: the same molar-M, drawn for 16px.

    Two differences from the app icon, both forced by size. No safe circle to respect, so
    the mark fills the frame instead of sitting at 47% of it. And the stroke is
    proportionally heavier — a 16px render has about one pixel to spare, so the fissure and
    the gap between the roots have to be wide enough to survive rounding to whole pixels.
    A mark that has to work at 16px is a different drawing from one that gets 180.

    Teal ground rather than transparent, so the tab reads as Molargo against light or dark
    browser chrome without a second file.

    SVG rather than .ico or .png: one file, crisp at every size a browser asks for,
    including the 32px of a bookmark bar. See App.razor for the legacy fallback.
-->
<svg width="64" height="64" viewBox="0 0 64 64" version="1.1"
     xmlns="http://www.w3.org/2000/svg">
    <rect x="0" y="0" width="64" height="64" fill="#14b8a6" />

    <path d="M 20,50 L 17,17 L 32,31 L 47,17 L 44,50"
          fill="none"
          stroke="#ffffff"
          stroke-width="11"
          stroke-linecap="round"
          stroke-linejoin="round" />
</svg>
