<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <!--
        maximum-scale and user-scalable=no keep a double-tap on a diary block from
        zooming the whole surgery tablet. viewport-fit=cover lets the layout run under
        the iPhone notch, which the safe-area div below then pads back out.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Molargo</title>
    <base href="/" />

    <!--
        The whole design system, built by Tailwind from
        DYS.Molargo.Shared/Shared/Styles/molargo.css. The Archivo webfont files it
        references are static web assets of the same library, so both are served from
        the app package with no network involved.
    -->
    <link rel="stylesheet" href="_content/DYS.Molargo.Shared/css/molargo.css" />

    <!-- Hand-written, outside the Tailwind build — see the note at the top of it. -->
    <link rel="stylesheet" href="_content/DYS.Molargo.Shared/css/print.css" />

    <!-- Scoped CSS for any component that uses it. Generated by the Razor SDK. -->
    <link rel="stylesheet" href="DYS.Molargo.styles.css" />

    <link rel="icon" href="data:," />
</head>

<body>
    <!-- Padded by app.css on iOS so the app bar clears the status bar. -->
    <div class="status-bar-safe-area"></div>

    <div id="app">Loading…</div>

    <script src="_framework/blazor.webview.js" autostart="false"></script>
</body>

</html>
